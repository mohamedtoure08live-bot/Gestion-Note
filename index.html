<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPS Notation - Evaluation Lancer de Poids Officiel</title>
  <meta name="description" content="Application de notation EPS officielle et automatique du lancer de poids pour les professeurs.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
</head>
<body>

  <div id="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-icon">
          <i class="fas fa-running"></i>
        </div>
        <div class="brand-info">
          <h2>EPS PRO</h2>
          <span>Notation & Barèmes</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="#dashboard" class="nav-item active">
          <i class="fas fa-chart-pie"></i>
          <span>Tableau de bord</span>
        </a>
        <a href="#notation" class="nav-item">
          <i class="fas fa-calculator"></i>
          <span>Notation Rapide</span>
        </a>
        <a href="#baremes" class="nav-item">
          <i class="fas fa-table-list"></i>
          <span>Gestion Barèmes</span>
        </a>
        <a href="#eleves" class="nav-item">
          <i class="fas fa-user-graduate"></i>
          <span>Liste des Élèves</span>
        </a>
        <a href="#historique" class="nav-item">
          <i class="fas fa-clock-rotate-left"></i>
          <span>Historique</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <span>Version 1.0.0</span>
        <i class="fas fa-shield-halved"></i>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <!-- Top Header -->
      <header class="top-header">
        <div class="header-title-area" style="display:flex; align-items:center; gap: 16px;">
          <button class="toggle-sidebar-btn" id="toggle-sidebar" aria-label="Toggle navigation">
            <i class="fas fa-bars"></i>
          </button>
          <h1 id="page-title">Tableau de Bord Analytics</h1>
        </div>

        <div class="header-actions">
          <span class="badge badge-note-high" style="padding: 6px 14px; font-size: 0.85rem;">
            <i class="fas fa-check"></i> Mode Hors-ligne Actif
          </span>
        </div>
      </header>

      <!-- Main Page Content Container -->
      <main class="page-content" id="view-container">
        <!-- Views rendered dynamically via js/app.js router -->
      </main>
    </div>
  </div>

  <!-- Main JavaScript Bundle -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
