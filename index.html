<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GHIM PRO | EPS Notation & Barèmes</title>
  <meta name="description"
    content="Découvrez GHIM PRO, une application dédiée à la notation des performances sportives et à la structuration de l'évaluation en EPS.">

  <!-- Open Graph / Meta Réseaux Sociaux -->
  <meta property="og:title" content="GHIM PRO | EPS Notation & Barèmes">
  <meta property="og:description"
    content="Découvrez GHIM PRO, une application dédiée à la notation des performances sportives et à la structuration de l'évaluation en EPS.">
  <meta property="og:type" content="website">

  <!-- Google Fonts : Inter, Outfit, Plus Jakarta Sans, Space Grotesk, IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet">

  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
  <link rel="stylesheet" href="css/landing.css">

  <!-- Supabase Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <!-- =========================================================================
       PUBLIC SHOWCASE / LANDING PAGE VIEW
       ========================================================================= -->
  <div id="landing-container">
    <!-- Rendered dynamically by js/views/landing.js -->
  </div>

  <!-- =========================================================================
       EXISTING OPERATIONAL APPLICATION FRAMEWORK
       ========================================================================= -->
  <div id="app-layout" style="display: none;">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-icon">
          <i class="fas fa-running"></i>
        </div>
        <div class="brand-info">
          <h2>GHIM PRO</h2>
          <span>Notation & Barèmes</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="#dashboard" class="nav-item active">
          <i class="fas fa-chart-pie"></i>
          <span>Tableau de bord</span>
        </a>
        <a href="#notation" class="nav-item">
          <i class="fas fa-calculator"></i>
          <span>Notation Rapide</span>
        </a>
        <a href="#baremes" class="nav-item">
          <i class="fas fa-table-list"></i>
          <span>Gestion Barèmes</span>
        </a>
        <a href="#eleves" class="nav-item">
          <i class="fas fa-user-graduate"></i>
          <span>Liste des Élèves</span>
        </a>
        <a href="#historique" class="nav-item">
          <i class="fas fa-clock-rotate-left"></i>
          <span>Historique</span>
        </a>
        
        <div style="margin: 20px 14px 10px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 14px;">
          <a href="#landing" class="nav-item" style="color: #60a5fa;">
            <i class="fas fa-globe"></i>
            <span>Vitrine Publique</span>
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <span>Version 1.0.0</span>
        <i class="fas fa-shield-halved"></i>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <!-- Top Header -->
      <header class="top-header">
        <div class="header-title-area" style="display:flex; align-items:center; gap: 16px;">
          <button class="toggle-sidebar-btn" id="toggle-sidebar" aria-label="Toggle navigation">
            <i class="fas fa-bars"></i>
          </button>
          <h1 id="page-title">Tableau de Bord Analytics</h1>
        </div>

        <div class="header-actions" style="display:flex; align-items:center; gap: 12px;">
          <a href="#landing" class="btn btn-sm btn-secondary" style="display:inline-flex; align-items:center; gap:6px; text-decoration:none;">
            <i class="fas fa-house"></i> <span>Vitrine</span>
          </a>
          <span class="badge badge-note-high" id="cloud-status-badge"
            style="padding: 6px 14px; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 8px;">
            <i class="fas fa-cloud"></i>
          </span>
        </div>
      </header>

      <!-- Main Page Content Container -->
      <main class="page-content" id="view-container">
        <!-- Views rendered dynamically via js/app.js router -->
      </main>
    </div>
  </div>

  <!-- Main JavaScript Bundle -->
  <script type="module" src="js/app.js"></script>
</body>

</html>
