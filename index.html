<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#0f172a">
  <title>GHIM PRO | EPS Notation & Barèmes</title>
  <meta name="description"
    content="Découvrez GHIM PRO, une application dédiée à la notation des performances sportives et à la structuration de l'évaluation en EPS.">

  <!-- Open Graph / Meta Réseaux Sociaux -->
  <meta property="og:title" content="GHIM PRO | EPS Notation & Barèmes">
  <meta property="og:description"
    content="Découvrez GHIM PRO, une application dédiée à la notation des performances sportives et à la structuration de l'évaluation en EPS.">
  <meta property="og:type" content="website">

  <!-- Google Fonts : Inter, Outfit, Plus Jakarta Sans, Space Grotesk, IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet">

  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/auth.css">

  <!-- Supabase Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <!-- =========================================================================
       PUBLIC SHOWCASE / LANDING PAGE VIEW
       ========================================================================= -->
  <div id="landing-container">
    <!-- Rendered dynamically by js/views/landing.js -->
  </div>

  <!-- =========================================================================
       EXISTING OPERATIONAL APPLICATION FRAMEWORK
       ========================================================================= -->
  <div id="app-layout" style="display: none;">
    <!-- Mobile Sidebar Backdrop Overlay -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div style="display:flex; align-items:center; gap: 14px; flex: 1; min-width: 0;">
          <div class="brand-icon">
            <i class="fas fa-running"></i>
          </div>
          <div class="brand-info">
            <h2>GHIM PRO</h2>
            <span>Notation & Barèmes</span>
          </div>
        </div>
        <button class="sidebar-close-btn" id="close-sidebar" aria-label="Fermer le menu">
          <i class="fas fa-xmark"></i>
        </button>
      </div>

      <nav class="sidebar-nav">
        <a href="#dashboard" class="nav-item active">
          <i class="fas fa-chart-pie"></i>
          <span>Tableau de bord</span>
        </a>
        <a href="#notation" class="nav-item">
          <i class="fas fa-calculator"></i>
          <span>Notation Rapide</span>
        </a>
        <a href="#baremes" class="nav-item">
          <i class="fas fa-table-list"></i>
          <span>Gestion Barèmes</span>
        </a>
        <a href="#classes" class="nav-item">
          <i class="fas fa-chalkboard-user"></i>
          <span>Mes classes</span>
        </a>
        <a href="#historique" class="nav-item">
          <i class="fas fa-clock-rotate-left"></i>
          <span>Historique</span>
        </a>
        <a href="#auth" class="nav-item" id="nav-item-auth">
          <i class="fas fa-user-circle"></i>
          <span>Espace Enseignant</span>
        </a>
        
        <div style="margin: 20px 14px 10px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 14px;">
          <a href="#landing" class="nav-item" style="color: #60a5fa;">
            <i class="fas fa-globe"></i>
            <span>Vitrine Publique</span>
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <span>Version 1.0.0</span>
        <i class="fas fa-shield-halved"></i>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <!-- Top Header -->
      <header class="top-header">
        <div class="header-title-area">
          <button class="toggle-sidebar-btn" id="toggle-sidebar" aria-label="Toggle navigation">
            <i class="fas fa-bars"></i>
          </button>
          <h1 id="page-title">Tableau de Bord Analytics</h1>
        </div>

        <div class="header-actions">
          <a href="#auth" class="header-user-btn" id="header-user-btn" title="Mon Compte Enseignant">
            <span class="header-user-avatar" id="header-user-avatar">S</span>
            <span id="header-user-name">M. Soro</span>
          </a>
          <a href="#landing" class="btn btn-sm btn-secondary header-btn-vitrine" style="display:inline-flex; align-items:center; gap:6px; text-decoration:none;">
            <i class="fas fa-house"></i> <span class="header-btn-text">Vitrine</span>
          </a>
          <span class="badge badge-note-high" id="cloud-status-badge"
            style="padding: 6px 12px; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 8px;">
            <i class="fas fa-cloud"></i>
          </span>
        </div>
      </header>

      <!-- Main Page Content Container -->
      <main class="page-content" id="view-container">
        <!-- Views rendered dynamically via js/app.js router -->
      </main>
    </div>

    <!-- iOS Native Style Bottom Navigation Bar for Mobile -->
    <nav class="mobile-bottom-nav" id="mobile-bottom-nav">
      <a href="#dashboard" class="bottom-nav-item active" data-route="dashboard">
        <i class="fas fa-chart-pie"></i>
        <span>Stats</span>
      </a>
      <a href="#classes" class="bottom-nav-item" data-route="classes">
        <i class="fas fa-chalkboard-user"></i>
        <span>Classes</span>
      </a>
      <a href="#notation" class="bottom-nav-item bottom-nav-highlight" data-route="notation" aria-label="Notation Rapide">
        <div class="highlight-circle">
          <i class="fas fa-calculator"></i>
        </div>
        <span>Noter</span>
      </a>
      <a href="#baremes" class="bottom-nav-item" data-route="baremes">
        <i class="fas fa-table-list"></i>
        <span>Barèmes</span>
      </a>
      <a href="#historique" class="bottom-nav-item" data-route="historique">
        <i class="fas fa-clock-rotate-left"></i>
        <span>Historique</span>
      </a>
    </nav>
  </div>

  <!-- Main JavaScript Bundle -->
  <script type="module" src="js/app.js"></script>
</body>

</html>
